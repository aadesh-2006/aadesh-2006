name: 📊 Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📊 Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0D1117&title_color=FF6B35&text_color=C9D1D9&icon_color=FF6B35&border_color=30363D
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧑‍💻 Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=0D1117&title_color=FF6B35&text_color=C9D1D9&border_color=30363D
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "📊 Update GitHub stats" || exit 0
          git push
